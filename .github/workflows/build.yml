# 墨卷 Tauri 版 · Windows 构建与打包（云端，本地不占磁盘）
# 触发：手动 workflow_dispatch / 推 v* 标签
# 产物：NSIS 安装包 + 绿色单 exe（artifact）
name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri 构建（NSIS 安装包）
        run: npm run tauri build -- --bundles nsis

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mojuan-windows-${{ github.sha }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/mojuan-tauri.exe
          if-no-files-found: error
